services:
  - type: web
    name: vorldx-attendance-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  - type: web
    name: vorldx-attendance-web
    runtime: static
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
